<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C1121F" />
    <meta name="description" content="%APP_DESCRIPTION%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%APP_SHORT_NAME%" />
    <link rel="icon" href="/icons/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>%APP_NAME%</title>
    <script>
      // appearance before first paint (no white flash in dark mode); see src/lib/appearance.ts
      (function () {
        try {
          var d = document.documentElement;
          var mode = localStorage.getItem('somar.theme') || 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          d.dataset.theme = dark ? 'dark' : 'light';
          if (localStorage.getItem('somar.text') === 'large') d.dataset.text = 'large';
        } catch (e) {}
      })();
    </script>
    <!--APP_CONFIG-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
