# Local development only: a minimal Supabase-compatible stack + the app, no Supabase CLI needed.
#   docker compose up --build        → app on http://localhost:8080, Supabase gateway on http://localhost:8000
#   (ports are overridable with REVIEW_APP_PORT / REVIEW_KONG_PORT / REVIEW_DB_PORT; `npm run review` picks free ones)
# Keys below are the public Supabase *demo* keys (JWT secret below). Never use them in production.
x-jwt: &jwt
  JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
  ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.171
    environment:
      POSTGRES_PASSWORD: postgres
      JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      JWT_EXP: 3600
    volumes:
      - ./supabase/docker/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - db-data:/var/lib/postgresql/data
    ports: ['${REVIEW_DB_PORT:-54322}:5432']
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      retries: 20

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:${REVIEW_KONG_PORT:-8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:${REVIEW_APP_PORT:-8080}
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 10000
    restart: unless-stopped

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.3
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    restart: unless-stopped

  storage:
    image: public.ecr.aws/supabase/storage-api:v1.77.0
    depends_on: { db: { condition: service_healthy }, rest: { condition: service_started } }
    environment:
      <<: *jwt
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      DATABASE_URL: postgres://supabase_storage_admin:postgres@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes: [storage-data:/var/lib/storage]
    restart: unless-stopped

  kong:
    image: public.ecr.aws/supabase/kong:2.8.1
    depends_on: [auth, rest, storage]
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_PLUGINS: request-transformer,cors
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes: [./supabase/docker/kong.yml:/home/kong/kong.yml:ro]
    ports: ['${REVIEW_KONG_PORT:-8000}:8000']
    restart: unless-stopped

  migrate:
    image: public.ecr.aws/supabase/postgres:17.6.1.171
    depends_on: { db: { condition: service_healthy }, auth: { condition: service_started }, storage: { condition: service_started } }
    environment: { POSTGRES_PASSWORD: postgres }
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/docker/migrate.sh:/migrate.sh:ro
    entrypoint: ['sh', '/migrate.sh']
    restart: 'no'

  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: http://localhost:${REVIEW_KONG_PORT:-8000}
        VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    depends_on: { migrate: { condition: service_completed_successfully } }
    environment:
      PORT: 8080
      APP_BASE_URL: http://localhost:${REVIEW_APP_PORT:-8080}
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      VITE_SUPABASE_URL: http://localhost:${REVIEW_KONG_PORT:-8000}
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_STUDENT_EMAIL_DOMAIN: somar.local
      BOOTSTRAP_ADMIN_CODE: ADMIN
      BOOTSTRAP_ADMIN_PASSWORD: Admin@12345
    ports: ['${REVIEW_APP_PORT:-8080}:8080']

volumes:
  db-data:
  storage-data:
