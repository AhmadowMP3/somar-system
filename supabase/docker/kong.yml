_format_version: '2.1'
_transform: true
services:
  - name: auth
    url: http://auth:9999/
    routes: [{ name: auth, strip_path: true, paths: [/auth/v1/] }]
    plugins: [{ name: cors }]
  - name: rest
    url: http://rest:3000/
    routes: [{ name: rest, strip_path: true, paths: [/rest/v1/] }]
    plugins: [{ name: cors }]
  - name: storage
    url: http://storage:5000/
    routes: [{ name: storage, strip_path: true, paths: [/storage/v1/] }]
    plugins: [{ name: cors }]
